name: Offline security regressions

on:
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/offline-security.yml"

permissions:
  contents: read

jobs:
  offline-security:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      # No package lifecycle scripts, build, Payload bootstrap, secrets or DB.
      - run: npm ci --ignore-scripts
      - run: node --test test/*.test.mjs
      - run: npx tsc --noEmit --incremental false

